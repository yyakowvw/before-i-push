name: 'before-i-push'
description: 'Block pull requests that leak API keys or .env files, or leave debug code behind. Zero dependencies.'
author: 'Before I Deploy'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Folder to check'
    default: '.'
  full:
    description: 'Also run npm audit and the lint, typecheck, test and build scripts (needs dependencies installed)'
    default: 'false'
  strict:
    description: 'Fail on warnings too'
    default: 'false'
  comment:
    description: 'Post the report as a pull request comment (needs permissions: pull-requests: write)'
    default: 'true'
  github-token:
    description: 'Token used for the comment'
    default: ${{ github.token }}

outputs:
  score:
    description: 'Score from 0 to 100'
    value: ${{ steps.scan.outputs.score }}
  verdict:
    description: 'ready, warnings or blocked'
    value: ${{ steps.scan.outputs.verdict }}

runs:
  using: 'composite'
  steps:
    - id: scan
      shell: bash
      env:
        BIP_PATH: ${{ inputs.path }}
        BIP_FULL: ${{ inputs.full }}
        BIP_STRICT: ${{ inputs.strict }}
      run: |
        args=("$BIP_PATH")
        [ "$BIP_FULL" = "true" ] && args+=(--full)
        [ "$BIP_STRICT" = "true" ] && args+=(--strict)
        set +e
        node "$GITHUB_ACTION_PATH/bin/before-i-push.mjs" "${args[@]}" --json > "$RUNNER_TEMP/bip.json"
        code=$?
        set -e
        node --input-type=module -e '
          import fs from "node:fs";
          import { pathToFileURL } from "node:url";
          const { toMarkdown, toTerminal } = await import(pathToFileURL(process.env.GITHUB_ACTION_PATH + "/src/report.mjs"));
          const r = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/bip.json", "utf8"));
          fs.writeFileSync(process.env.RUNNER_TEMP + "/bip.md", toMarkdown(r));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, toMarkdown(r) + "\n");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `score=${r.score}\nverdict=${r.verdict}\n`);
          console.log(toTerminal(r, { color: true }));
        '
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      continue-on-error: true
      env:
        BIP_REPORT: ${{ runner.temp }}/bip.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const marker = '<!-- before-i-push -->';
          const body = `${marker}\n${fs.readFileSync(process.env.BIP_REPORT, 'utf8')}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body && c.body.startsWith(marker));
          if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          else await github.rest.issues.createComment({ owner, repo, issue_number, body });

    - shell: bash
      run: exit ${{ steps.scan.outputs.exit_code }}
